<style>

:root[data-theme="dark"]{--bg:#0B1020;--card:#131A33;--soft:#1A2347;--line:#27325E;--text:#EEF1FF;--mut:#9BA6CF;--brand:#6F8BFF}
*{box-sizing:border-box}html{scroll-behavior:smooth;height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 'Plus Jakarta Sans','Noto Sans Bengali',system-ui,sans-serif;min-height:100%;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.w{width:min(1120px,100% - 40px);margin:auto}

.nav{display:flex;align-items:center;height:68px;gap:6px}.logo{border:0;background:none;padding:0;margin-right:auto}.logo img{height:30px;display:block}
.nl button,.tg{border:0;background:none;color:#ffffffcc;padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px}.nl button:hover,.nl button.on,.tg:hover{background:#ffffff1f;color:#fff}.nl{display:flex}
.bur{display:none}

.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:700;background:var(--brand);color:#fff}.btn.w2{background:#fff;color:#1A33A8}.btn.o{background:none;border:1px solid var(--line);color:var(--text)}

@keyframes draw{from{stroke-dashoffset:3200}to{stroke-dashoffset:0}}@keyframes dr{from{transform:translate(0,0) rotate(0)}to{transform:translate(34px,-26px) rotate(5deg)}}@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.hero{background-size:220% 220%;animation:gs 14s ease-in-out infinite alternate}

.bo textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;min-height:70px}.bo{margin-bottom:14px}.bo small{color:var(--mut)}

mission:['আমাদের মিশন','নাম শুধু একটি শব্দ নয়, এটি আপনার পরিচয়।',`<h3>আমরা কী বিশ্বাস করি</h3><p>প্রত্যেক মানুষের অধিকার আছে নিজের পরিচয় নিজের মতো করে প্রকাশ করার। অনলাইনে সেই কাজটি যেন সহজ, দ্রুত ও সবার জন্য উন্মুক্ত হয়, এটাই TachiNick-এর লক্ষ্য।</p><h3>আমাদের মিশন</h3><p>বাংলাভাষী ও আন্তর্জাতিক ব্যবহারকারীদের জন্য এমন টুল তৈরি করা, যা জটিলতা ছাড়াই নাম, বায়ো ও ডিজিটাল পরিচয়কে সুন্দরভাবে সাজাতে সাহায্য করে।</p><h3>আমাদের নীতি</h3><p><b>সহজ:</b> কয়েক সেকেন্ডে ফলাফল, কোনো প্রশিক্ষণ ছাড়াই।<br><b>নিরাপদ:</b> আপনার লেখা সার্ভারে পাঠানো হয় না।<br><b>উন্মুক্ত:</b> সাইন-আপ ছাড়া বিনামূল্যে ব্যবহারযোগ্য।</p><h3>ভিশন</h3><p>নাম ও স্টাইলের জন্য সবচেয়ে বিশ্বস্ত ও ব্যবহারবান্ধব প্ল্যাটফর্ম হয়ে ওঠা।</p><p class="mut">Development by TACHIN</p>`],
privacy:['প্রাইভেসি পলিসি','আপনার তথ্যের ওপর নিয়ন্ত্রণ আপনারই।',`<h3>আমরা কী সংগ্রহ করি</h3><p>আপনি যে নাম বা লেখা টাইপ করেন তা আপনার ডিভাইসেই প্রসেস হয়; আমাদের সার্ভারে পাঠানো হয় না।</p><h3>সেভ করা তথ্য</h3><p>"সেভ করা" তালিকা শুধু আপনার ব্রাউজারের লোকাল স্টোরেজে থাকে। ব্রাউজার ডেটা মুছলে তা মুছে যাবে।</p><h3>যোগাযোগ</h3><p>প্রাইভেসি নিয়ে প্রশ্ন থাকলে TACHIN-এর সাথে যোগাযোগ করুন।</p>`],
terms:['ব্যবহারের শর্তাবলি','TachiNick ব্যবহারের আগে অনুগ্রহ করে পড়ুন।',`<h3>ব্যবহার</h3><p>টুলগুলো ব্যক্তিগত ও বৈধ কাজে বিনামূল্যে ব্যবহার করা যাবে। অন্যের পরিচয় নকল বা প্রতারণামূলক কাজে ব্যবহার নিষিদ্ধ।</p><h3>প্ল্যাটফর্মের নিয়ম</h3><p>তৈরি করা নাম কোনো অ্যাপ বা গেমে গ্রহণযোগ্য হবে কি না, তা সেই প্ল্যাটফর্মের নিয়মের ওপর নির্ভর করে।</p><h3>দায়সীমা</h3><p>সেবাটি "যেমন আছে" ভিত্তিতে দেওয়া হয়। নির্দিষ্ট ফলাফলের নিশ্চয়তা আমরা দিই না।</p>`]};

app.innerHTML=`<div class="w pg"><div class="cr"><button data-go="studio">স্টুডিও</button> / QR আইডেন্টিটি</div><h1>QR আইডেন্টিটি</h1><p class="mut">QR কোড আপনার ব্রাউজারেই তৈরি হয়। কোনো বাইরের সেবায় তথ্য পাঠানো হয় না। QR অ্যাক্সেস কন্ট্রোল নয়, লিংক জানা যে কেউ পেজ দেখতে পারবে।</p><div class="stg" id="ed"><div>${FI('url','পাবলিক লিংক (https://...)',Q.url,'text','maxlength=200 inputmode=url')}${FI('name','পুরো নাম',Q.name,'text','maxlength=40')}${FI('title','উপাধি / পদবি',Q.title,'text','maxlength=50')}<div class="cg">${FI('fg','QR রঙ',Q.fg,'color')}${FI('bg','ব্যাকগ্রাউন্ড',Q.bg,'color')}</div>${SE('size','সাইজ',[[256,'256 px'],[512,'512 px'],[1024,'1024 px']],512)}<label class="fl"><input type="checkbox" data-k="logo" style="display:inline;width:auto"> মাঝখানে মনোগ্রাম (ছোট)</label><details><summary>vCard (.vcf) অপশন</summary><label class="fl"><input type="checkbox" data-k="vn" checked style="display:inline;width:auto"> নাম</label><label class="fl"><input type="checkbox" data-k="vt" checked style="display:inline;width:auto"> পদবি</label><label class="fl"><input type="checkbox" data-k="vu" checked style="display:inline;width:auto"> লিংক</label><p class="mut" style="font-size:13px">ফোন বা ইমেইল যোগ করা হয় না। ডাউনলোড করলেও গ্রহীতাকে নিজে ইমপোর্ট নিশ্চিত করতে হবে।</p></details><div id="wr"></div></div><div class="pv"><canvas id="cv" role="img" aria-label="QR"></canvas><p class="mut" id="ul" style="font-size:13px;word-break:break-all"></p><div class="bx"><button class="btn" id="d1">QR PNG</button><button class="btn" id="d2">কনট্যাক্ট কার্ড PNG</button><button class="btn o" id="d3">vCard</button><button class="btn o" id="d4">লিংক কপি</button><button class="btn o" id="d5">শেয়ার</button></div></div></div></div>`;
const ed=$('#ed'),cv=$('#cv');let ok=false;const mk=(sz,logo)=>{const u=hurl(Q.url);if(!u||typeof qrcode=='undefined')return null;const q=qrcode(0,logo?'H':'M');q.addData(u);q.make();const n=q.getModuleCount(),c=Math.max(2,Math.floor(sz/(n+8))),W=c*(n+8),k=document.createElement('canvas');k.width=k.height=W;const x=k.getContext('2d');x.fillStyle=Q.bg;x.fillRect(0,0,W,W);x.fillStyle=Q.fg;for(let r=0;r<n;r++)for(let i=0;i<n;i++)if(q.isDark(r,i))x.fillRect((i+4)*c,(r+4)*c,c,c);if(logo){const d=W*.2;x.fillStyle=Q.bg;x.beginPath();x.arc(W/2,W/2,d*.62,0,7);x.fill();x.fillStyle=Q.fg;x.font=`700 ${d*.7}px ${FONTS.sans}`;x.textAlign='center';x.textBaseline='middle';x.fillText(([...(Q.name||'T').trim()][0]||'T').toUpperCase(),W/2,W/2+d*.04)}return k};
const draw=()=>{const w=$('#wr'),u=hurl(Q.url),k=mk(+Q.size,Q.logo);ok=!!k;w.innerHTML=!Q.url?'':!u?'<div class="wn">শুধু https:// লিংক গ্রহণযোগ্য</div>':typeof qrcode=='undefined'?'<div class="wn">QR লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ দেখুন।</div>':'';const c=ctr(Q.fg,Q.bg);if(u&&(c<3||lum(Q.fg)>lum(Q.bg)))w.innerHTML+='<div class="wn">রঙের কনট্রাস্ট কম বা QR উল্টো, স্ক্যান নাও হতে পারে। ডাউনলোডের পর টেস্ট করে নিন।</div>';const x=(cv.width=cv.height=k?k.width:300,cv.getContext('2d'));x.fillStyle='#eee';x.fillRect(0,0,cv.width,cv.width);if(k)x.drawImage(k,0,0);$('#ul').textContent=u||'';};
ed.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(k)Q[k]=t.type=='checkbox'?t.checked:t.value;requestAnimationFrame(draw)});
const need=()=>ok?true:(toast('আগে একটি বৈধ https লিংক দিন'),false);
$('#d1').onclick=()=>need()&&dlc(mk(+Q.size,Q.logo),fn(Q.name)+'-identity-qr.png');
$('#d2').onclick=()=>{if(!need())return;let S={tpl:'pro',...TPL.pro,name:'',sub:'',tag:'',user:'',link:'',al:'left',rad:32,fnt:'sans',sz:'ls'};try{Object.assign(S,JSON.parse(localStorage.tn_card||'{}'))}catch(e){}S.name=Q.name||S.name;S.sub=Q.title||S.sub;S.link=hurl(Q.url).replace(/^https:\/\//,'');const c=document.createElement('canvas');drawCard(c,S,1200,630,mk(400,false));dlc(c,fn(Q.name)+'-contact-card.png')};
$('#d3').onclick=()=>{if(!need())return;const cl=t=>String(t).replace(/[\u0000-\u001F\u007F]/g,' ').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,'),L=['BEGIN:VCARD','VERSION:3.0','FN:'+cl(Q.name||'TachiNick')];if(Q.vt&&Q.title)L.push('TITLE:'+cl(Q.title));if(Q.vu)L.push('URL:'+hurl(Q.url));L.push('END:VCARD');dl(new Blob([L.join('\r\n')],{type:'text/vcard;charset=utf-8'}),fn(Q.name)+'.vcf')};
$('#d4').onclick=()=>need()&&cpy(hurl(Q.url));$('#d5').onclick=()=>{if(!need())return;const u=hurl(Q.url);navigator.share?navigator.share({url:u}).catch(()=>{}):cpy(u)};draw()}
T.idcard={m:'Id',n:'আইডেন্টিটি কার্ড',d:'লাইভ প্রিভিউসহ কার্ড ডিজাইন করে PNG নামান।'};T.biopack={m:'Bp',n:'বায়ো প্যাক',d:'এক তথ্য থেকে বিভিন্ন প্ল্যাটফর্মের বায়ো।'};T.brand={m:'Bk',n:'ব্র্যান্ড কিট',d:'রঙ, ফন্ট, মনোগ্রাম ও ব্যানার।'};T.pubpage={m:'Pp',n:'পাবলিক পেজ',d:'প্রোফাইল পেজের ড্রাফট ও HTML ফাইল।'};T.check={m:'Ck',n:'কম্প্যাটিবিলিটি চেকার',d:'কোন নাম কোন প্ল্যাটফর্মে সমস্যা করতে পারে তা দেখুন।'};T.qr={m:'Qr',n:'QR আইডেন্টিটি',d:'QR কোড ও কনট্যাক্ট কার্ড।'};
const ST=['idcard','biopack','brand','pubpage','check','qr'];CG.splice(0,0,['স্টুডিও',ST]);CG[4][1]=['symlib'];
